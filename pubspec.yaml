name: shorts_video_player
description: Widget Flutter personalizado para reprodução de vídeos estilo YouTube Shorts
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Video player
  video_player: ^2.8.1
  chewie: ^1.7.5
  
  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  firebase_analytics: ^10.7.4
  
  # HTTP requests for Cloudflare Stream
  http: ^1.1.2
  
  # UI components
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true